name: Bump minor version

# Runs after every push to main and commits a minor-version bump straight back
# to main. The commit message carries [skip ci], which GitHub Actions treats
# as a built-in signal to skip triggering any workflow (including this one and
# deploy-pages.yml) for that push — no manual loop guard needed.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump minor version
        id: bump
        run: |
          NEW_VERSION=$(npm version minor --no-git-tag-version)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main
